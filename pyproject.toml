[project]
name = "mcp-doc-generator"
version = "0.1.0"
description = "MCP server for generating PDF/Word/Excel documents from structured input."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp[cli]==2.14.3",
  "reportlab==4.4.7",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "jsonpath-ng==1.7.0",
  "docxtpl==0.20.0",
  "pydantic"
]

[project.scripts]
mcp-doc-generator = "mcp_doc_generator.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_doc_generator"]
